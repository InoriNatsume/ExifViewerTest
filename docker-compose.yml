services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      # Windows + Docker Desktop에서 파일 변경 감지를 안정적으로 하기 위한 옵션
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./app:/app
      - ./docker:/scripts:ro
      - app_node_modules:/app/node_modules
    command: ["sh", "/scripts/dev.sh"]

volumes:
  app_node_modules:
